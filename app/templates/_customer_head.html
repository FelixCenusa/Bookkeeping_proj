
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("sk-js");
      // Load-in and scroll reveals: only with motion allowed, and only until
      // solsken.js takes over. If it has not within 2 s, show everything.
      if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        root.classList.add("sk-motion");
        window.setTimeout(function () {
          if (!root.classList.contains("sk-motion-on")) root.classList.remove("sk-motion");
        }, 2000);
      }
    })();
  </script>
