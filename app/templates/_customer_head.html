
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
  <script>
    document.documentElement.classList.add("pr-js");
    // Load-in and scroll reveals: [data-reveal] is hidden only under html.pr-motion.
    // planritning.js drops the class when Motion is missing; this drops it if nothing ran.
    if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("pr-motion");
      window.setTimeout(function () {
        if (!window.__prMotion) document.documentElement.classList.remove("pr-motion");
      }, 2000);
    }
    // If planritning.js never boots, show the drawings without their entrance.
    window.setTimeout(function () {
      if (!window.__prReady) document.documentElement.classList.remove("pr-js");
    }, 4000);
    if (window.tailwind) {
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              baltic: { DEFAULT: "#0F4C75", ink: "#0B3A5A", tint: "#E9F0F6" },
              graphite: "#16181D",
            },
            fontFamily: {
              grotesk: ["Schibsted Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
              plex: ["IBM Plex Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/planritning.css') }}">
