{% extends "base.html" %}
{% block content %}
<section class="sk-auth">
  <div class="sk-container sk-auth__grid">
    <div class="sk-auth__head">
      <h1 class="sk-h1" data-reveal="load">Glömt lösenord</h1>
      <p class="sk-lead mt-5" data-reveal="load">Skriv din e-post så skickar vi en länk där du väljer ett nytt lösenord.</p>
    </div>

    <div class="sk-auth__panel" data-reveal="load">
      <form method="post" class="sk-authform">
        <div>
          <label class="sk-label" for="email">E-post</label>
          <input id="email" name="email" type="email" required autocomplete="email" class="sk-input">
        </div>

        <button type="submit" class="sk-btn sk-btn--primary sk-btn--block">Skicka länk</button>
      </form>

      <p class="sk-authswitch"><a class="sk-link" href="{{ url_for('auth.login_form') }}">Tillbaka till inloggningen</a></p>
    </div>

    <div class="sk-auth__aside sk-scallop sk-bg-sun" data-reveal="load">
      <p><strong>Så funkar det.</strong> Finns adressen hos oss får du ett mejl med en länk. Länken gäller en begränsad tid.</p>
    </div>
  </div>
</section>
{% endblock %}
