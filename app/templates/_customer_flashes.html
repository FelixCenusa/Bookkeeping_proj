{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="sk-flashes sk-container" role="status">
      {% for category, message in messages %}
        <div class="sk-flash {% if category == 'success' %}sk-flash--success{% else %}sk-flash--error{% endif %}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
