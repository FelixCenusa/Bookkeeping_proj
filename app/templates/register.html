{% extends "base.html" %}
{% block content %}
<section class="sk-auth">
  <div class="sk-container sk-auth__grid">
    <div class="sk-auth__head">
      <h1 class="sk-h1" data-reveal="load">Skapa konto</h1>
      <p class="sk-lead mt-5" data-reveal="load">Med ett konto följer du dina bokningar och slipper fylla i dina uppgifter varje gång.</p>
    </div>

    <div class="sk-auth__panel" data-reveal="load">
      <form method="post" class="sk-authform">
        <div>
          <label class="sk-label" for="full_name">Namn</label>
          <input id="full_name" name="full_name" required autocomplete="name" class="sk-input">
        </div>
        <div>
          <label class="sk-label" for="email">E-post</label>
          <input id="email" name="email" type="email" required autocomplete="email" class="sk-input">
        </div>
        <div>
          <label class="sk-label" for="phone">Telefon <span class="sk-muted font-medium">(valfritt)</span></label>
          <input id="phone" name="phone" autocomplete="tel" class="sk-input">
        </div>
        <div class="sk-authform__pair">
          <div>
            <label class="sk-label" for="password">Lösenord</label>
            <input id="password" name="password" type="password" required autocomplete="new-password" class="sk-input">
          </div>
          <div>
            <label class="sk-label" for="password_confirm">Upprepa lösenordet</label>
            <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" class="sk-input">
          </div>
        </div>

        <button type="submit" class="sk-btn sk-btn--primary sk-btn--block">Skapa konto</button>
      </form>

      <p class="sk-authswitch">Har du redan ett konto? <a class="sk-link" href="{{ url_for('auth.login_form') }}">Logga in</a></p>
    </div>

    <figure class="sk-auth__photo" data-reveal="load">
      <img
        src="{{ url_for('static', filename='img/solsken/pennants-blue-sky.jpg') }}"
        width="1000"
        height="750"
        alt="Flaggspel i många färger och ljusslingor mot en blå himmel"
        loading="lazy"
        decoding="async"
      >
      <div class="sk-valance" aria-hidden="true">{% for i in range(32) %}<span style="--i:{{ i }}"></span>{% endfor %}</div>
    </figure>
  </div>
</section>
{% endblock %}
