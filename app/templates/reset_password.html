{% extends "base.html" %}
{% import "_customer_auth.html" as auth %}
{% block content %}
{% call auth.auth_shell("Välj nytt lösenord") %}
  <p class="mt-4 max-w-[42ch] text-lg leading-relaxed text-[#cfd6e0]">
    Du byter lösenord för <span class="font-semibold text-[#f2ece2]">{{ email }}</span>.
  </p>

  <form method="post" class="mt-10 max-w-[28rem] space-y-5">
    <div>
      <label class="kv-field-label" for="password">Nytt lösenord</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" class="{{ auth.kv_auth_input }}">
    </div>

    <div>
      <label class="kv-field-label" for="password_confirm">Upprepa lösenordet</label>
      <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" class="{{ auth.kv_auth_input }}">
    </div>

    <button class="kv-btn kv-btn-lamp w-full">Spara nytt lösenord</button>
  </form>
{% endcall %}
{% endblock %}
