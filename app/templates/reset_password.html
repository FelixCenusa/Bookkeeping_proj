{% extends "base.html" %}
{% block content %}
<section class="sk-auth">
  <div class="sk-container sk-auth__grid">
    <div class="sk-auth__head">
      <h1 class="sk-h1">Välj nytt lösenord</h1>
      <p class="sk-lead mt-5">Du byter lösenord för kontot<br><strong class="[overflow-wrap:anywhere]">{{ email }}</strong></p>
    </div>

    <div class="sk-auth__panel">
      <form method="post" class="sk-authform">
        <div>
          <label class="sk-label" for="password">Nytt lösenord</label>
          <input id="password" name="password" type="password" required autocomplete="new-password" class="sk-input">
        </div>

        <div>
          <label class="sk-label" for="password_confirm">Upprepa lösenordet</label>
          <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" class="sk-input">
        </div>

        <button type="submit" class="sk-btn sk-btn--primary sk-btn--block">Spara nytt lösenord</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
