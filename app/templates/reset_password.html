{% extends "base.html" %}
{% block content %}
<div class="pr-page pr-auth">
  <div class="pr-wrap pr-auth__grid">
    <header class="pr-auth__intro">
      <h1 class="pr-h1 pr-h1--page">Välj nytt lösenord</h1>
      <p class="pr-lede">Du byter lösenord för <strong class="pr-auth__email">{{ email }}</strong>. Skriv det nya lösenordet två gånger.</p>
    </header>

    <div class="pr-auth__panel">
      <form method="post" class="pr-auth__form">
        <div class="pr-fieldset">
          <label class="pr-label" for="password">Nytt lösenord</label>
          <input id="password" name="password" type="password" required autocomplete="new-password" class="pr-field">
        </div>

        <div class="pr-fieldset">
          <label class="pr-label" for="password_confirm">Upprepa lösenordet</label>
          <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" class="pr-field">
        </div>

        <button class="pr-btn pr-btn--primary pr-btn--block">Spara nytt lösenord</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
